<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Link</title>
</head>
<body style="margin: 0; padding: 0;">
    <!-- 상단 불투명 헤더 -->
    <header style="position: fixed; top: 0; left: 0; width: 100%; height: 120px; background-color: rgba(0, 0, 0, 0.5); color: white; font-size: 50px; text-align: center; display: flex; align-items: center; justify-content: center;">
        Veriface
    </header>

    <!-- 첫 번째 배경 이미지 섹션 -->
    <section style="height: 130vh; background-color: #882a27; background-image: url('back2.png'); background-size: cover; background-position: center;">
        <!-- 링크를 감싼 상단 중앙 텍스트 -->
        <a href="index.html" style="display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-decoration: none; width: 100%; height: 100%;">
            <!-- Click to start 버튼 추가 -->
            <button style="position: fixed; margin-top: 200px; font-size: 20px; padding: 10px 20px; background-color: white; color: #882a27; border: none; border-radius: 5px; cursor: pointer;">
                Click to start
            </button>
        </a>
    </section>

    <!-- 두 번째 배경 이미지 섹션 -->
    <section style="height: 150vh; background-color: #882a27; background-image: url('back3.png'); background-size: cover; background-position: center;">
        <h2 style="text-align: center; margin-top: 0px; font-size: 55px; color: white;">
            Unveiling the meaning of every microexpression
        </h2>
    </section>
    <section style="height: 150vh; background-color: #882a27; background-image: url('back4.png'); background-size: cover; background-position: center;">
        <h2 style="text-align: center; margin-top: 0px; padding-top: 130px; font-size: 55px; color: white;">
            Expression exploration, redefined
        </h2>
    </section>
</body>
</html>
